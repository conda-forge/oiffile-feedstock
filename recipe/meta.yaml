{% set name = "oiffile" %}
{% set version = "2026.10.15" %}
{% set sha256 = "7321f5d492c02f1f477b0bc6f8323b4171c49ba0e9076b5cb9ffdca6d0902273" %}
{% set python_min = "3.12" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --ignore-installed --no-cache-dir -vvv
  noarch: python

requirements:
  host:
    - pip
    - python {{ python_min }}
    - setuptools
  run:
    - matplotlib-base
    - numpy >=2.0.0
    - python >={{ python_min }}
    - tifffile >=2026.10.15

test:
  imports:
    - oiffile
  commands:
    - pip list
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://www.cgohlke.com/
  summary: Read Olympus image files (OIF and OIB)
  license: BSD-3-Clause
  license_file: LICENSE
  description: |
    Oiffile is a Python library to read image and metadata from Olympus Image Format files. OIF is the native file format of the Olympus FluoView(tm) software for confocal microscopy.
  dev_url: https://github.com/cgohlke/oiffile/

extra:
  recipe-maintainers:
    - cgohlke
    - goanpeca
    - jaimergp
